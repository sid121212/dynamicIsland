name: Rebuild website after a public release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request Cloudflare Pages rebuild
        env:
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: scripts/site-rebuild.sh
