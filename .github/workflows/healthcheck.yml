name: Public download health
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow redirects and check both public assets
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/healthcheck.sh
