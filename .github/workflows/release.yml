name: Release free Mac app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-publisher
  cancel-in-progress: false
jobs:
  release:
    # This source uses Swift 6.2's default-isolation flag. Select a recent Xcode explicitly.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve pinned release tools without Homebrew
        run: scripts/bootstrap-release-tools.sh
      - name: Build, sign, package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: scripts/ci-release.sh
      - name: Rebuild website for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: scripts/site-rebuild.sh
      - name: Preserve built public artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - name: Remove temporary signing files even after cancellation
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for dir in "$RUNNER_TEMP"/notch-release.*; do
            security remove-trusted-cert "$dir/signer.crt" >/dev/null 2>&1 || true
            security delete-keychain "$dir/release.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$dir"
          done
