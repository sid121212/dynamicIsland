name: Notify website of a published app release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to notify (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch app-released to the site
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPO: ${{ vars.SITE_REPO }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_DISPATCH_TOKEN" || { echo 'Set the SITE_DISPATCH_TOKEN secret'; exit 1; }
          [[ "$SITE_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || { echo 'Set SITE_REPO=owner/site-repo repository variable'; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Choose a published vX.Y.Z release tag'; exit 1; }
          payload=$(python3 -c 'import json,os;print(json.dumps({"event_type":"app-released","client_payload":{"slug":"notch","version":os.environ["TAG"]}}))')
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$SITE_REPO/dispatches" --data "$payload")
          test "$status" = 204 || { echo "Site dispatch failed: HTTP $status (expected 204)"; exit 1; }
